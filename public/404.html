<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Jose Claudio | Portfolio</title>
    <script>
      // SPA fallback for GitHub Pages: redirect unknown paths to index.html
      // while preserving the path for BrowserRouter.
      sessionStorage.setItem("gh-pages-redirect", location.pathname + location.search + location.hash);
      var base = "/portfolio-website";
      location.replace(base + "/");
    </script>
  </head>
  <body></body>
</html>
