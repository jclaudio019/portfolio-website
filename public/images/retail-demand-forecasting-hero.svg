<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="788" viewBox="0 0 1400 788" role="img" aria-labelledby="title desc">
  <title id="title">Retail Demand Forecasting — test results and workflow</title>
  <desc id="desc">Bar chart of Naive versus best model WAPE for FOODS, HOBBIES, and HOUSEHOLD, plus the project workflow.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0a0f"/>
      <stop offset="100%" stop-color="#12121a"/>
    </linearGradient>
    <filter id="soft" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect width="1400" height="788" fill="url(#bg)"/>
  <circle cx="1180" cy="120" r="220" fill="#a855f7" fill-opacity="0.08"/>
  <circle cx="180" cy="680" r="180" fill="#3987e5" fill-opacity="0.07"/>

  <text x="56" y="64" fill="#a855f7" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" letter-spacing="3">RETAIL DEMAND FORECASTING</text>
  <text x="56" y="112" fill="#ececf1" font-family="Georgia, serif" font-size="36" font-weight="700">Category-level POS demand · M5 retail data</text>
  <text x="56" y="148" fill="#898781" font-family="system-ui, sans-serif" font-size="16">Every advanced model beat Naive. The best approach was category-specific.</text>

  <!-- Left panel: chart -->
  <g filter="url(#soft)">
    <rect x="56" y="190" width="720" height="500" rx="4" fill="#15151c" stroke="#2c2c2a"/>
  </g>
  <text x="84" y="230" fill="#ececf1" font-family="system-ui, sans-serif" font-size="18" font-weight="600">Final 365-day test WAPE — Naive vs best model</text>
  <text x="84" y="254" fill="#898781" font-family="ui-monospace, Menlo, monospace" font-size="12">Lower is better</text>

  <!-- Y axis labels -->
  <text x="78" y="520" fill="#898781" font-family="ui-monospace, Menlo, monospace" font-size="11">0%</text>
  <text x="70" y="430" fill="#898781" font-family="ui-monospace, Menlo, monospace" font-size="11">10%</text>
  <text x="70" y="340" fill="#898781" font-family="ui-monospace, Menlo, monospace" font-size="11">20%</text>
  <line x1="110" y1="300" x2="740" y2="300" stroke="#2c2c2a"/>
  <line x1="110" y1="390" x2="740" y2="390" stroke="#2c2c2a"/>
  <line x1="110" y1="480" x2="740" y2="480" stroke="#2c2c2a"/>
  <line x1="110" y1="570" x2="740" y2="570" stroke="#2c2c2a"/>

  <!-- FOODS: Naive 16.10 -> h=144.9, Best 10.22 -> h=91.98; baseline y=570 -->
  <!-- scale: 1% = 9px -->
  <rect x="170" y="425" width="54" height="145" fill="#5a5a62"/>
  <rect x="236" y="478" width="54" height="92" fill="#3987e5"/>
  <text x="197" y="595" fill="#ececf1" font-family="ui-monospace, Menlo, monospace" font-size="12" text-anchor="middle">FOODS</text>
  <text x="263" y="468" fill="#ececf1" font-family="ui-monospace, Menlo, monospace" font-size="11" text-anchor="middle">10.22%</text>
  <text x="263" y="452" fill="#898781" font-family="ui-monospace, Menlo, monospace" font-size="10" text-anchor="middle">XGBoost</text>
  <text x="197" y="415" fill="#c3c2b7" font-family="ui-monospace, Menlo, monospace" font-size="11" text-anchor="middle">16.10%</text>

  <!-- HOBBIES: Naive 17.47 -> 157.2, Best 8.00 -> 72 -->
  <rect x="360" y="413" width="54" height="157" fill="#5a5a62"/>
  <rect x="426" y="498" width="54" height="72" fill="#d95926"/>
  <text x="387" y="595" fill="#ececf1" font-family="ui-monospace, Menlo, monospace" font-size="12" text-anchor="middle">HOBBIES</text>
  <text x="453" y="488" fill="#ececf1" font-family="ui-monospace, Menlo, monospace" font-size="11" text-anchor="middle">8.00%</text>
  <text x="453" y="472" fill="#898781" font-family="ui-monospace, Menlo, monospace" font-size="10" text-anchor="middle">XGBoost</text>
  <text x="387" y="403" fill="#c3c2b7" font-family="ui-monospace, Menlo, monospace" font-size="11" text-anchor="middle">17.47%</text>

  <!-- HOUSEHOLD: Naive 19.88 -> 179, Best 7.05 -> 63.5 -->
  <rect x="550" y="391" width="54" height="179" fill="#5a5a62"/>
  <rect x="616" y="507" width="54" height="63" fill="#199e70"/>
  <text x="577" y="595" fill="#ececf1" font-family="ui-monospace, Menlo, monospace" font-size="12" text-anchor="middle">HOUSEHOLD</text>
  <text x="643" y="497" fill="#ececf1" font-family="ui-monospace, Menlo, monospace" font-size="11" text-anchor="middle">7.05%</text>
  <text x="643" y="481" fill="#898781" font-family="ui-monospace, Menlo, monospace" font-size="10" text-anchor="middle">Lin. Reg.</text>
  <text x="577" y="381" fill="#c3c2b7" font-family="ui-monospace, Menlo, monospace" font-size="11" text-anchor="middle">19.88%</text>

  <!-- Legend -->
  <rect x="84" y="640" width="14" height="14" fill="#5a5a62"/>
  <text x="106" y="652" fill="#c3c2b7" font-family="system-ui, sans-serif" font-size="13">Naive benchmark</text>
  <rect x="260" y="640" width="14" height="14" fill="#3987e5"/>
  <text x="282" y="652" fill="#c3c2b7" font-family="system-ui, sans-serif" font-size="13">Best observed model</text>

  <!-- Right panel: workflow -->
  <g filter="url(#soft)">
    <rect x="812" y="190" width="532" height="500" rx="4" fill="#15151c" stroke="#2c2c2a"/>
  </g>
  <text x="840" y="230" fill="#ececf1" font-family="system-ui, sans-serif" font-size="18" font-weight="600">What we built</text>

  <!-- workflow steps -->
  <rect x="840" y="260" width="476" height="52" fill="#1c1c24" stroke="#3a3a44"/>
  <text x="860" y="282" fill="#a855f7" font-family="ui-monospace, Menlo, monospace" font-size="12">01</text>
  <text x="900" y="282" fill="#ececf1" font-family="system-ui, sans-serif" font-size="14" font-weight="600">Data preparation</text>
  <text x="900" y="300" fill="#898781" font-family="system-ui, sans-serif" font-size="12">M5 sales → daily FOODS / HOBBIES / HOUSEHOLD</text>

  <rect x="840" y="324" width="476" height="52" fill="#1c1c24" stroke="#3a3a44"/>
  <text x="860" y="346" fill="#a855f7" font-family="ui-monospace, Menlo, monospace" font-size="12">02</text>
  <text x="900" y="346" fill="#ececf1" font-family="system-ui, sans-serif" font-size="14" font-weight="600">Baselines</text>
  <text x="900" y="364" fill="#898781" font-family="system-ui, sans-serif" font-size="12">Naive · Seasonal Naive · 7-day SMA · ETS</text>

  <rect x="840" y="388" width="476" height="52" fill="#1c1c24" stroke="#3a3a44"/>
  <text x="860" y="410" fill="#a855f7" font-family="ui-monospace, Menlo, monospace" font-size="12">03</text>
  <text x="900" y="410" fill="#ececf1" font-family="system-ui, sans-serif" font-size="14" font-weight="600">Feature-based models</text>
  <text x="900" y="428" fill="#898781" font-family="system-ui, sans-serif" font-size="12">Linear Regression · Prophet · XGBoost</text>

  <rect x="840" y="452" width="476" height="52" fill="#1c1c24" stroke="#3a3a44"/>
  <text x="860" y="474" fill="#a855f7" font-family="ui-monospace, Menlo, monospace" font-size="12">04</text>
  <text x="900" y="474" fill="#ececf1" font-family="system-ui, sans-serif" font-size="14" font-weight="600">Leakage-safe validation</text>
  <text x="900" y="492" fill="#898781" font-family="system-ui, sans-serif" font-size="12">13 expanding monthly windows · freeze winners</text>

  <rect x="840" y="516" width="476" height="52" fill="#1c1c24" stroke="#3a3a44"/>
  <text x="860" y="538" fill="#a855f7" font-family="ui-monospace, Menlo, monospace" font-size="12">05</text>
  <text x="900" y="538" fill="#ececf1" font-family="system-ui, sans-serif" font-size="14" font-weight="600">Untouched test year</text>
  <text x="900" y="556" fill="#898781" font-family="system-ui, sans-serif" font-size="12">One 365-day holdout — no post-test tuning</text>

  <rect x="840" y="590" width="476" height="70" fill="#1a1224" stroke="#a855f7" stroke-opacity="0.45"/>
  <text x="860" y="618" fill="#a855f7" font-family="ui-monospace, Menlo, monospace" font-size="12">CONCLUSION</text>
  <text x="860" y="640" fill="#ececf1" font-family="system-ui, sans-serif" font-size="13">Use category-specific models. Complexity only when it earns its keep.</text>

  <text x="56" y="760" fill="#5a5a62" font-family="ui-monospace, Menlo, monospace" font-size="11">Source: fixed test evaluation · WAPE = weighted absolute percentage error · Jose Claudio portfolio</text>
</svg>
