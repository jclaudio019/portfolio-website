name: CI

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run test:all
      - name: Verify Worker URL configuration
        env:
          REACT_APP_WORKER_API_URL: ${{ vars.WORKER_API_URL }}
        run: test -n "$REACT_APP_WORKER_API_URL"
      - run: npm run build
        env:
          REACT_APP_WORKER_API_URL: ${{ vars.WORKER_API_URL }}
